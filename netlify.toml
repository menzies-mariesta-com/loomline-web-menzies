[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  # Public config values appear in docs/examples; keep scanning for real secrets.
  SECRETS_SCAN_OMIT_KEYS = "ORIGIN,ORG_IMAGE_BUCKET,TRIAL_REQUEST_INBOX,SEED_PLATFORM_ADMIN_EMAIL"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/admin/packs"
  to = "/admin/templates"
  status = 301

[[redirects]]
  from = "/admin/packs/*"
  to = "/admin/templates/:splat"
  status = 301

[[redirects]]
  from = "/admin/settings"
  to = "/admin/config"
  status = 301

[[redirects]]
  from = "/admin/settings/*"
  to = "/admin/config/:splat"
  status = 301

[[headers]]
  for = "/display/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/kiosk/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/t/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/workspaces"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/workspaces/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/platform"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/platform/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/app"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/app/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/b/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/auth/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'self'"

[[headers]]
  for = "/og-nextup.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/pricing"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/privacy"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=86400, stale-while-revalidate=86400"

[[headers]]
  for = "/terms"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=86400, stale-while-revalidate=86400"

[[headers]]
  for = "/docs/*"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=3600, stale-while-revalidate=86400"
